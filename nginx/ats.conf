# ==============================================================================
# Enterprise ATS - Nginx Reverse Proxy Configuration
# Production Architecture for High-Concurrency Multi-Tenant ATS
# ==============================================================================

# Rate Limiting Zone: 40 requests per second per IP with 10MB memory zone
limit_req_zone $binary_remote_addr zone=ats_api_rate_limit:10m rate=40r/s;

# Upstream Load Balancers
upstream ats_core_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream ats_admin_backend {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream ats_frontend_ui {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost ats.local _;

    # Maximum payload size for large candidate resume parsing (PDF, DOCX up to 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip High-Performance Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Powered-By "Enterprise-ATS-Nginx" always;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 1. Admin Fleet API Gateway (Port 5001)
    location /api/v1/admin/ {
        proxy_pass http://ats_admin_backend;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Admin API Alternative Path (Direct Client routing)
    location /admin-api/v1/ {
        rewrite ^/admin-api/v1/(.*) /api/v1/admin/$1 break;
        proxy_pass http://ats_admin_backend;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Admin OpenAPI Swagger Documentation
    location /admin-docs {
        proxy_pass http://ats_admin_backend;
        proxy_set_header Connection "";
    }

    # 2. WebSocket Real-Time Channel (Port 5000 / Socket.IO)
    location /socket.io/ {
        proxy_pass http://ats_core_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Core Enterprise ATS REST API (Port 5000)
    location /api/v1/ {
        limit_req zone=ats_api_rate_limit burst=50 nodelay;
        proxy_pass http://ats_core_backend;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Core OpenAPI Swagger Documentation
    location /api/docs {
        proxy_pass http://ats_core_backend;
        proxy_set_header Connection "";
    }

    # 4. Frontend Single Page Application (Port 3001)
    location / {
        proxy_pass http://ats_frontend_ui;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

