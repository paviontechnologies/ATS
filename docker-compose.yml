version: '3.8'

services:
  # Nginx Production Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/ats.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-api
    restart: unless-stopped

  # Node.js Express Core API
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node server/src/index.js
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=ats_root_password
      - DB_NAME=enterprise_ats
      - TRUST_PROXY=1
    depends_on:
      - mysql
    restart: unless-stopped

  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=ats_root_password
      - MYSQL_DATABASE=enterprise_ats
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  mysql-data:
