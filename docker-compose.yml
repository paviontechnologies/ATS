version: '3.8'

services:
  # Node.js Express API & Web Application
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=enterprise_ats_production_jwt_secret_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - MONGODB_URI=mongodb://mongo:27017/enterprise_ats
    depends_on:
      - mongo
      - redis
      - ai-service
    restart: unless-stopped

  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  # MongoDB 7.0 Multi-Tenant Database
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Redis 7.0 Cache & Queue
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
